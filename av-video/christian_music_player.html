<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:image" content="ico1.jpg">
<title>Моя Музыкальная Сборка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Arial',sans-serif;
  background:linear-gradient(135deg,#0f0f23 0%,#1a1a2e 50%,#16213e 100%);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:130px;
}

/* === Большая обложка === */
.container{max-width:1200px;margin:0 auto;padding:20px}
.album-section{text-align:center;margin-bottom:50px}
.album-cover{
  width:800px;
  height:450px;
  max-width:95vw;
  margin:0 auto;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  background:linear-gradient(45deg,#00d299c2,#fef9d7,#99b9ff);
  animation:albumGlow 4s ease-in-out infinite alternate;
  position:relative;
}
@keyframes albumGlow{
  0%{box-shadow:0 20px 60px rgba(0,212,255,0.3)}
  100%{box-shadow:0 30px 80px rgba(255,0,110,0.5)}
}
.album-video{width:100%;height:100%;object-fit:cover}

.album-info{margin-top:20px}
.album-title{
  font-size:2.8em;
  font-weight:bold;
  background:linear-gradient(45deg,#00d4ff,#ff006e);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* === Плейлист === */
.playlist{
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:30px;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
}
.track{
  display:flex;
  align-items:center;
  padding:15px;
  margin-bottom:12px;
  background:rgba(255,255,255,0.03);
  border-radius:15px;
  cursor:pointer;
  transition:all .3s ease;
  position:relative;
  overflow:hidden;
}
.track:hover{background:rgba(255,255,255,0.08);transform:translateX(8px)}
.track.playing{
  background:linear-gradient(90deg,rgba(0,212,255,0.2),rgba(255,0,110,0.2));
  border:1px solid rgba(0,212,255,0.5);
}
.track-number{
  width:40px;height:40px;
  background:rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-right:20px;
  font-weight:bold;
  transition:all .3s;
}
.track.playing .track-number{
  background:linear-gradient(45deg,#00d4ff,#ff006e);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.track-info{flex:1}
.track-title{font-size:1.2em;margin-bottom:4px}
.track-artist,.track-duration{color:rgba(255,255,255,0.6);font-size:.9em}

.playing-indicator{display:none;margin-left:20px}
.track.playing .playing-indicator{display:flex;align-items:flex-end;height:20px;gap:2px}
.bar{
  width:3px;
  background:linear-gradient(to top,#00d4ff,#ff006e);
  border-radius:3px;
  animation:soundWave .6s ease-in-out infinite;
}
.bar:nth-child(1){height:8px;animation-delay:0s}
.bar:nth-child(2){height:16px;animation-delay:.1s}
.bar:nth-child(3){height:12px;animation-delay:.2s}
.bar:nth-child(4){height:18px;animation-delay:.3s}
.bar:nth-child(5){height:10px;animation-delay:.4s}
@keyframes soundWave{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}

/* === НОВАЯ НИЖНЯЯ ПАНЕЛЬ === */
.player-controls-wrapper{
  position:fixed;
  bottom:0;left:0;right:0;
  background:rgba(15,15,35,0.98);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,212,255,0.2);
  padding:12px 20px;
  z-index:1000;
  box-shadow:0 -10px 40px rgba(0,0,0,0.4);
}
.controls-content{
  max-width:1200px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:15px;
}
.control-btns{display:flex;gap:12px;flex-shrink:0}
.control-btn{
  width:42px;height:42px;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:none;color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1em;
  transition:all .3s;
}
.control-btn:hover{background:rgba(255,255,255,0.2);transform:scale(1.08)}

/* === ИЗМЕНЕНИЕ: Добавлен border-radius 50% === */
.play-btn{
  width:56px;height:56px;
  background:linear-gradient(45deg,#00d4ff,#ff006e);
  font-size:1.4em;
  box-shadow:0 5px 20px rgba(0,212,255,0.4);
  border-radius: 50%; /* Сделали кнопку круглой */
  border: none; /* Убрали стандартную рамку, если есть */
  color: #fff;
  cursor: pointer;
  display:flex;align-items:center;justify-content:center; /* Центровка иконки */
  transition:all .3s;
}
.play-btn:hover{transform:scale(1.1)}

.progress-container{flex:1;min-width:0}
.time-display{
  display:flex;
  justify-content:space-between;
  color:rgba(255,255,255,0.5);
  font-size:.85em;
  margin-bottom:6px;
  font-family:monospace;
}
.progress-bar{
  width:100%;height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:3px;
  cursor:pointer;
  position:relative;
}
.progress{
  height:100%;
  background:linear-gradient(90deg,#00d4ff,#ff006e);
  border-radius:3px;
  width:0%;
  transition:width .1s;
  position:relative;
}
.progress::after{
  content:'';
  position:absolute;
  right:0;top:50%;
  transform:translateY(-50%);
  width:14px;height:14px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 12px rgba(0,212,255,0.7);
}

.volume-control{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.volume-icon{font-size:1.2em;color:rgba(255,255,255,0.7);cursor:pointer}
.volume-slider{
  width:100px;height:5px;
  background:rgba(255,255,255,0.1);
  border-radius:3px;
  cursor:pointer;
  -webkit-appearance:none;
}
.volume-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 10px rgba(0,212,255,0.6);
}

/* === Адаптив === */
@media (max-width:868px){
  .album-cover{width:95vw;height:auto;aspect-ratio:16/9}
  .album-title{font-size:2.2em}
  .player-controls-wrapper{padding:10px}
  .play-btn{width:50px;height:50px;font-size:1.3em}
  .volume-slider{width:80px}
}
@media (max-width:480px){
  .album-title{font-size:1.8em}
  .control-btn{width:38px;height:38px}
  .play-btn{width:48px;height:48px}
  .volume-slider{width:60px}
  .controls-content{gap:10px}
}
</style>
</head>
<body>

<div class="container">
  <div class="album-section">
    <div class="album-cover">
      <video class="album-video" id="albumVideo" src="online-video.mp4" muted loop playsinline></video>
    </div>
    <div class="album-info">
      <h1 class="album-title">Моя Музыкальная Сборка</h1>
      <p>Создано специально для вас ♡</p>
    </div>
  </div>

  <div class="playlist" id="playlist"></div>
</div>

<div class="player-controls-wrapper">
  <div class="controls-content">
    <div class="control-btns">
      <button class="control-btn" onclick="previousTrack()">⏮</button>
      <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
      <button class="control-btn" onclick="nextTrack()">⏭</button>
    </div>

    <div class="progress-container">
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
      <div class="progress-bar" id="progressBar">
        <div class="progress" id="progressFill"></div>
      </div>
    </div>

    <div class="volume-control">
      <span class="volume-icon" id="volumeIcon">🔊</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
    </div>

    <div style="display:flex;gap:10px;">
      <button class="control-btn" id="repeatBtn" onclick="toggleRepeat()">🔁</button>
      <button class="control-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const tracks = [
  {title:"track1.mp3",artist:"Артист 1",src:"track1.mp3",duration:"2:18"},
  {title:"Осень в платье пышном",artist:"Артист 2",src:"Осень_в_платье_пышном.mp3",duration:"4:12"},
  {title:"Снова жёлтой листвой покрылась_земля(2)",artist:"Артист 3",src:"Снова_жёлтой_листвой_покрылась_земля(2).mp3",duration:"3:25"},
  {title:"Уже не лето но ещё не осень(2)",artist:"Артист 4",src:"Уже_не_лето_но_ещё_не_осень(2).mp3",duration:"2:18"},
  {title:"Смотри как осень краски щедро льёт",artist:"Артист 5",src:"Смотри_как_осень_краски_щедро_льёт.mp3",duration:"3:45"},
  {title:"Вот опять наступила осень",artist:"Артист 6",src:"Вот_опять_наступила_осень.mp3",duration:"4:12"},
  {title:"Жёлтые листья медленно кружат",artist:"Артист 7",src:"Жёлтые_листья_медленно_кружат.mp3",duration:"5:30"},
  {title:"Одна листва",artist:"Артист 8",src:"Одна_листва.mp3",duration:"3:45"},
  {title:"Снова жёлтой листвой покрылась земля",artist:"Артист 9",src:"Снова_жёлтой_листвой_покрылась_земля.mp3",duration:"2:30"},
  {title:"Снова осень пришла",artist:"Артист 10",src:"Снова_осень_пришла.mp3",duration:"3:25"},
  {title:"Вот опять наступила осень(2)",artist:"Артист 11",src:"Вот_опять_наступила_осень(2).mp3",duration:"3:40"}
];

const playlist = document.getElementById('playlist');
const audio = document.getElementById('audio');
const albumVideo = document.getElementById('albumVideo');
const playPauseBtn = document.getElementById('playPauseBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const volumeSlider = document.getElementById('volumeSlider');
const volumeIcon = document.getElementById('volumeIcon');
const repeatBtn = document.getElementById('repeatBtn');
const shuffleBtn = document.getElementById('shuffleBtn');

let currentTrack = null;
let isPlaying = false;
let repeatMode = 0; // 0-off, 1-track, 2-all
let shuffleMode = false;
let playHistory = [];

// Заполнение плейлиста
tracks.forEach((t,i) => {
  playlist.innerHTML += `
    <div class="track" onclick="playTrack(${i})">
      <div class="track-number">${i+1}</div>
      <div class="track-info">
        <div class="track-title">${t.title.replace('.mp3','')}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <div class="track-duration">${t.duration}</div>
      <div class="playing-indicator">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>`;
});

function playTrack(i){
  document.querySelectorAll('.track').forEach(el=>el.classList.remove('playing','paused'));
  currentTrack = i;
  playHistory.push(i);
  if(playHistory.length>20) playHistory.shift();

  audio.src = tracks[i].src;
  audio.play();
  // Видео запустится только здесь, при нажатии на трек
  albumVideo.play(); 
  isPlaying = true;
  playPauseBtn.textContent = '⏸';
  document.querySelectorAll('.track')[i].classList.add('playing');
  saveState();
}

function togglePlay(){
  if(currentTrack===null){ playTrack(0); return; }
  if(isPlaying){
    audio.pause();
    albumVideo.pause();
    isPlaying = false;
    playPauseBtn.textContent = '▶';
    document.querySelectorAll('.track')[currentTrack]?.classList.add('paused');
  }else{
    audio.play();
    albumVideo.play();
    isPlaying = true;
    playPauseBtn.textContent = '⏸';
    document.querySelectorAll('.track')[currentTrack]?.classList.remove('paused');
  }
}

function nextTrack(){
  if(currentTrack===null) return;
  let next;
  if(shuffleMode){
    do{ next = Math.floor(Math.random()*tracks.length); }
    while(next===currentTrack && tracks.length>1);
  }else{
    next = currentTrack + 1;
    if(next >= tracks.length){
      next = (repeatMode===2) ? 0 : currentTrack;
      if(repeatMode!==2){ isPlaying=false; playPauseBtn.textContent='▶'; return; }
    }
  }
  playTrack(next);
}

function previousTrack(){
  if(currentTrack===null) return;
  if(shuffleMode && playHistory.length>1){
    playHistory.pop();
    playTrack(playHistory[playHistory.length-1]);
  }else{
    let prev = currentTrack-1;
    if(prev<0) prev = tracks.length-1;
    playTrack(prev);
  }
}

function toggleRepeat(){
  repeatMode = (repeatMode+1)%3;
  const txt = ['Выкл','Трек','Все'];
  repeatBtn.style.background = repeatMode>0 ? 'linear-gradient(45deg,#00d4ff,#ff006e)' : '';
  repeatBtn.textContent = '🔁'+txt[repeatMode];
  audio.loop = repeatMode===1;
  saveState();
}

function toggleShuffle(){
  shuffleMode = !shuffleMode;
  shuffleBtn.style.background = shuffleMode ? 'linear-gradient(45deg,#00d4ff,#ff006e)' : '';
  saveState();
}

function formatTime(s){
  if(isNaN(s)) return '0:00';
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return `${m}:${sec<10?'0':''}${sec}`;
}

// Прогресс
audio.addEventListener('timeupdate',()=>{
  if(audio.duration){
    const percent = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = percent + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
});
audio.addEventListener('loadedmetadata',()=>{
  totalTimeEl.textContent = formatTime(audio.duration);
});
progressBar.addEventListener('click',(e)=>{
  const rect = progressBar.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pos * audio.duration;
});

// Громкость
volumeSlider.addEventListener('input',()=>{
  audio.volume = volumeSlider.value/100;
  updateVolumeIcon(volumeSlider.value);
});
function updateVolumeIcon(v){
  if(v==0) volumeIcon.textContent='🔇';
  else if(v<33) volumeIcon.textContent='🔈';
  else if(v<66) volumeIcon.textContent='🔉';
  else volumeIcon.textContent='🔊';
}

// Сохранение состояния
function saveState(){
  const state = {
    track: currentTrack,
    time: audio.currentTime,
    volume: audio.volume,
    repeat: repeatMode,
    shuffle: shuffleMode,
    playing: isPlaying
  };
  try{
    const str = btoa(JSON.stringify(state));
    history.replaceState(null,'',location.pathname + '#' + str);
  }catch(e){}
}
function loadState(){
  try{
    const hash = location.hash.slice(1);
    if(!hash) return;
    const state = JSON.parse(atob(hash));
    if(state.track != null && state.track < tracks.length){
      currentTrack = state.track;
      audio.src = tracks[currentTrack].src;
      audio.currentTime = state.time || 0;
      audio.volume = state.volume || 1;
      volumeSlider.value = audio.volume*100;
      updateVolumeIcon(volumeSlider.value);
      repeatMode = state.repeat || 0;
      shuffleMode = state.shuffle || false;
      audio.loop = repeatMode===1;
      toggleRepeat(); 
      toggleShuffle(); 
      document.querySelectorAll('.track')[currentTrack].classList.add('playing');
      if(state.playing){
        audio.play();
        albumVideo.play();
        isPlaying = true;
        playPauseBtn.textContent = '⏸';
      }
    }
  }catch(e){}
}

// Конец трека
audio.addEventListener('ended',()=>{ if(repeatMode!==1) nextTrack(); });

// Загрузка при старте
window.addEventListener('load',()=>{
  loadState();
  // СТРОКУ albumVideo.play() УДАЛИЛИ - видео не запустится само
  updateVolumeIcon(volumeSlider.value);
});
</script>
</body>
</html>
