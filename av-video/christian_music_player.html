<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:image" content="ico1.jpg">
<title>Музична Християнська Збірка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Arial',sans-serif;
  background:linear-gradient(135deg,#0f0f23 0%,#1a1a2e 50%,#16213e 100%);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:130px;
}

/* === Контейнер === */
.container{
  max-width:1200px;
  margin:0 auto;
  padding:20px;
}

/* === Обкладинка та Відео === */
.album-section{text-align:center;margin-bottom:40px; position: relative;}
.cover-placeholder { transition: height 0.3s; }

.album-cover{
  width:800px;
  height:450px;
  max-width:100%;
  margin:0 auto;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  background:linear-gradient(45deg,#00d299c2,#fef9d7,#99b9ff);
  animation:albumGlow 4s ease-in-out infinite alternate;
  position:relative;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 100;
}
.album-cover.pinned {
  position: fixed;
  bottom: 140px;
  right: 20px;
  width: 280px !important;
  height: 158px !important;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  border: 2px solid rgba(255,255,255,0.1);
  animation: none;
  z-index: 2000;
}
@keyframes albumGlow{
  0%{box-shadow:0 20px 60px rgba(0,212,255,0.3)}
  100%{box-shadow:0 30px 80px rgba(255,0,110,0.5)}
}
.album-video{width:100%;height:100%;object-fit:cover}

.pin-btn {
  position: absolute; top: 15px; right: 15px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255,255,255,0.2);
  color: white; width: 35px; height: 35px;
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2em; opacity: 0;
  transition: opacity 0.3s, transform 0.2s; z-index: 10;
}
.album-cover:hover .pin-btn, .album-cover.pinned .pin-btn { opacity: 1; }
.pin-btn:hover { background: rgba(0, 212, 255, 0.8); transform: scale(1.1); }

.album-info{margin-top:20px}
.album-title{
  font-size:2.5em; font-weight:bold;
  background:linear-gradient(45deg,#00d4ff,#ff006e);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  padding: 0 10px;
}

/* === Плейлист === */
.playlist{
  background:rgba(255,255,255,0.05);
  border-radius:20px; padding:20px;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
}
.track{
  display:flex; align-items:center;
  padding:12px 15px; margin-bottom:8px;
  background:rgba(255,255,255,0.03);
  border-radius:12px; cursor:pointer;
  transition:all .2s ease; position:relative;
  overflow:hidden;
}
.track:active{background:rgba(255,255,255,0.1);}
.track.playing{
  background:linear-gradient(90deg,rgba(0,212,255,0.15),rgba(255,0,110,0.15));
  border:1px solid rgba(0,212,255,0.4);
}
.track-number{
  width:32px; height:32px; flex-shrink: 0;
  background:rgba(255,255,255,0.1);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-right:12px; font-size: 0.9em; font-weight:bold;
}
.track.playing .track-number{
  background:linear-gradient(45deg,#00d4ff,#ff006e);
  animation:pulse 1.5s ease-in-out infinite;
}

/* === АНІМАЦІЯ ЕКВАЛАЙЗЕРА === */
.playing-indicator{display:none;margin-left:10px}
.track.playing .playing-indicator{display:flex;align-items:flex-end;height:15px;gap:2px}

.bar{
  width:3px;
  background:linear-gradient(to top,#00d4ff,#ff006e);
  border-radius:3px;
  animation: soundWave 0.8s ease-in-out infinite;
}

.bar:nth-child(1){height:6px; animation-duration: 0.6s;}
.bar:nth-child(2){height:12px; animation-duration: 0.8s;}
.bar:nth-child(3){height:8px; animation-duration: 1.1s;}

/* Пауза анімації */
.track.paused .bar, .track.paused .track-number {
  animation-play-state: paused !important;
  opacity: 0.6;
}

@keyframes soundWave {
  0% { transform: scaleY(0.5); }
  50% { transform: scaleY(1.5); }
  100% { transform: scaleY(0.5); }
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.track-info{flex:1; min-width: 0; margin-right: 10px;}
.track-title{font-size:1.1em; margin-bottom:3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.track-artist{color:rgba(255,255,255,0.6); font-size:.85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.track-duration{color:rgba(255,255,255,0.6); font-size:.85em; flex-shrink: 0;}

/* === Панель керування === */
.player-controls-wrapper{
  position:fixed; bottom:0;left:0;right:0;
  background:rgba(15,15,35,0.98);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,212,255,0.2);
  padding:12px 20px; z-index:1000;
  box-shadow:0 -10px 40px rgba(0,0,0,0.4);
}
.controls-content{
  max-width:1200px; margin:0 auto;
  display:flex; align-items:center; gap:15px;
}
.control-btns{display:flex;gap:12px;flex-shrink:0}
.control-btn{
  width:42px;height:42px; border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:none;color:#fff; cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1em; transition:all .3s;
}
.play-btn{
  width:56px;height:56px;
  background:linear-gradient(45deg,#00d4ff,#ff006e);
  font-size:1.4em; box-shadow:0 5px 20px rgba(0,212,255,0.4);
  border-radius: 50%; border: none; color: #fff;
  cursor: pointer; display:flex;align-items:center;justify-content:center;
  transition:all .3s;
}
.progress-container{flex:1;min-width:0}
.time-display{
  display:flex;justify-content:space-between;
  color:rgba(255,255,255,0.5);font-size:.85em;
  margin-bottom:6px;font-family:monospace;
}
.progress-bar{
  width:100%;height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:3px; cursor:pointer;position:relative;
}
.progress{
  height:100%;background:linear-gradient(90deg,#00d4ff,#ff006e);
  border-radius:3px;width:0%;
}
.volume-control{display:flex;align-items:center;gap:8px;flex-shrink:0}
.volume-icon{font-size:1.2em;color:rgba(255,255,255,0.7)}
.volume-slider{width:80px;height:5px;border-radius:3px;cursor:pointer}

/* === АДАПТИВ === */
@media (max-width: 600px) {
  .container { padding: 10px 5px; }
  .playlist { padding: 10px 0; background: transparent; border: none; }
  .album-cover { border-radius: 10px; height: auto; aspect-ratio: 16/9; }
  .album-title { font-size: 1.6em; margin-bottom: 5px; }
  .track { padding: 10px 5px; margin-bottom: 4px; border-radius: 8px; }
  .track-number { width: 24px; height: 24px; font-size: 0.75em; margin-right: 8px; }
  .track-title { font-size: 0.95em; }
  .track-artist { font-size: 0.8em; }
  .track-duration { font-size: 0.75em; }
  .player-controls-wrapper { padding: 8px 10px; }
  .play-btn { width: 48px; height: 48px; font-size: 1.2em; }
  .control-btn { width: 36px; height: 36px; font-size: 1em; }
  .volume-control { display: none; }
  .controls-content { gap: 8px; }
  .album-cover.pinned {
    width: 140px !important; height: 80px !important;
    bottom: 130px; right: 10px; border-width: 1px;
  }
  .pin-btn { opacity: 1; width: 30px; height: 30px; font-size: 1em; }
}
</style>
</head>
<body>

<div class="container">
  <div class="album-section">
    <div class="cover-placeholder" id="coverPlaceholder">
      <div class="album-cover" id="albumCover">
        <button class="pin-btn" id="pinBtn" onclick="togglePin()" title="Закріпити плеєр">📌</button>
        <video class="album-video" id="albumVideo" src="video.mp4" muted loop playsinline></video>
      </div>
    </div>
    <div class="album-info">
      <h1 class="album-title">Музична Збірка</h1>
      <p style="font-size: 0.9em; opacity: 0.7;">Приємного прослуховування</p>
    </div>
  </div>
  <div class="playlist" id="playlist"></div>
</div>

<div class="player-controls-wrapper">
  <div class="controls-content">
    <div class="control-btns">
      <button class="control-btn" onclick="previousTrack()">⏮</button>
      <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
      <button class="control-btn" onclick="nextTrack()">⏭</button>
    </div>
    <div class="progress-container">
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
      <div class="progress-bar" id="progressBar">
        <div class="progress" id="progressFill"></div>
      </div>
    </div>
    <div class="volume-control">
      <span class="volume-icon" id="volumeIcon">🔊</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
    </div>
    <div style="display:flex;gap:5px;">
      <button class="control-btn" id="repeatBtn" onclick="toggleRepeat()">🔁</button>
      <button class="control-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const tracks = [
  {title: "Оправдана  Оля Кушнір  Ксенія Осадчук", artist: "Неизвестный исполнитель", src: "Оправдана  Оля Кушнір  Ксенія Осадчук.mp3", duration: "4:09"},
  {title: "Кожен ранок Ти зі мною (UA)", artist: "Bible Musiс", src: "Bible Musiс - Кожен ранок Ти зі мною (UA).mp3", duration: "3:56"},
  {title: "Навчи мене ходити по воді", artist: "Неизвестный исполнитель", src: "Навчи мене ходити по воді.mp3", duration: "3:45"},
  {title: "авторская песня Фиалка Хомига", artist: "🎵 Творцу спасибо", src: "🎵 Творцу спасибо - авторская песня Фиалка Хомига.mp3", duration: "7:52"},
  {title: "Не буває квітів без дощів  Inna Dominova-AI", artist: "Неизвестный исполнитель", src: "Не буває квітів без дощів  Inna Dominova-AI.mp3", duration: "3:22"},
  {title: "Все можу здолати з Тобою  Inna Dominova-AI", artist: "Неизвестный исполнитель", src: "Все можу здолати з Тобою  Inna Dominova-AI.mp3", duration: "3:12"},
  {title: "Дім Твій святий — Edge Worship", artist: "Неизвестный исполнитель", src: "Дім Твій святий — Edge Worship.mp3", duration: "4:06"},
  {title: "Знаю, Хто Ти є  ✝️ Ukrainian worship songs", artist: "Неизвестный исполнитель", src: "Знаю, Хто Ти є  ✝️ Ukrainian worship songs.mp3", duration: "3:41"},
  {title: "Мир, как река  Дана Морозова и Виктор Шатецкий", artist: "Неизвестный исполнитель", src: "Мир, как река  Дана Морозова и Виктор Шатецкий.mp3", duration: "3:52"},
  {title: "Спаситель мой и Бог  Nella Fantasia", artist: "Неизвестный исполнитель", src: "Спаситель мой и Бог  Nella Fantasia.mp3", duration: "3:39"},
  {title: "Хвали душе, моя Господа  Inna Dominova-AI", artist: "Неизвестный исполнитель", src: "Хвали душе, моя Господа  Inna Dominova-AI.mp3", duration: "3:40"},
  {title: "Flow Praise  Хвала і поклоніння. Життя по вірі", artist: "Щаслива бути донькою Царя", src: "Щаслива бути донькою Царя - Flow Praise  Хвала і поклоніння. Життя по вірі.mp3", duration: "4:59"},
  {title: "Edge Worship)", artist: "Яхве, я слабка", src: "Яхве, я слабка - Edge Worship).mp3", duration: "3:03"},
];

const playlist = document.getElementById('playlist');
const audio = document.getElementById('audio');
const albumVideo = document.getElementById('albumVideo');
const playPauseBtn = document.getElementById('playPauseBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const volumeSlider = document.getElementById('volumeSlider');
const volumeIcon = document.getElementById('volumeIcon');
const repeatBtn = document.getElementById('repeatBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const albumCover = document.getElementById('albumCover');
const coverPlaceholder = document.getElementById('coverPlaceholder');
const pinBtn = document.getElementById('pinBtn');

let currentTrack = null;
let isPlaying = false;
let repeatMode = 0;
let shuffleMode = false;
let playHistory = [];
let isPinned = false;

tracks.forEach((t,i) => {
  playlist.innerHTML += `
    <div class="track" onclick="playTrack(${i})">
      <div class="track-number">${i+1}</div>
      <div class="track-info">
        <div class="track-title">${t.title.replace('.mp3','')}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <div class="track-duration">${t.duration}</div>
      <div class="playing-indicator">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>`;
});

function togglePin() {
  isPinned = !isPinned;
  if (isPinned) {
    coverPlaceholder.style.height = albumCover.offsetHeight + 'px';
    albumCover.classList.add('pinned');
    pinBtn.textContent = '↙';
    pinBtn.title = "Повернути на місце";
  } else {
    albumCover.classList.remove('pinned');
    setTimeout(() => { coverPlaceholder.style.height = 'auto'; }, 400);
    pinBtn.textContent = '📌';
    pinBtn.title = "Закріпити плеєр";
  }
}

function playTrack(i){
  document.querySelectorAll('.track').forEach(el=>{
    el.classList.remove('playing','paused');
  });
  
  currentTrack = i;
  playHistory.push(i);
  if(playHistory.length>20) playHistory.shift();

  audio.src = tracks[i].src;
  
  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise.then(_ => {
      albumVideo.play().catch(e => {}); 
      isPlaying = true;
      playPauseBtn.textContent = '⏸';
      const trackEl = document.querySelectorAll('.track')[i];
      trackEl.classList.add('playing');
      trackEl.classList.remove('paused');
      saveState();
    }).catch(error => {
      isPlaying = false;
      playPauseBtn.textContent = '▶';
    });
  }
}

function togglePlay(){
  if(currentTrack===null){ playTrack(0); return; }
  const trackEl = document.querySelectorAll('.track')[currentTrack];
  
  if(isPlaying){
    audio.pause();
    albumVideo.pause();
    isPlaying = false;
    playPauseBtn.textContent = '▶';
    if(trackEl) trackEl.classList.add('paused');
  }else{
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(_ => {
        albumVideo.play().catch(e=>{});
        isPlaying = true;
        playPauseBtn.textContent = '⏸';
        if(trackEl) trackEl.classList.remove('paused');
      }).catch(e => {});
    }
  }
}

function nextTrack(){
  if(currentTrack===null) return;
  let next;
  if(shuffleMode){
    do{ next = Math.floor(Math.random()*tracks.length); }
    while(next===currentTrack && tracks.length>1);
  }else{
    next = currentTrack + 1;
    if(next >= tracks.length){
      next = (repeatMode===2) ? 0 : currentTrack;
      if(repeatMode!==2){ 
        isPlaying=false; 
        playPauseBtn.textContent='▶'; 
        document.querySelectorAll('.track')[currentTrack]?.classList.add('paused');
        return; 
      }
    }
  }
  playTrack(next);
}

function previousTrack(){
  if(currentTrack===null) return;
  if(shuffleMode && playHistory.length>1){
    playHistory.pop();
    playTrack(playHistory[playHistory.length-1]);
  }else{
    let prev = currentTrack-1;
    if(prev<0) prev = tracks.length-1;
    playTrack(prev);
  }
}

function toggleRepeat(){
  repeatMode = (repeatMode+1)%3;
  const icons = ['🔁', '🔂', '🔁All'];
  repeatBtn.style.background = repeatMode>0 ? 'linear-gradient(45deg,#00d4ff,#ff006e)' : '';
  repeatBtn.textContent = icons[repeatMode];
  audio.loop = repeatMode===1;
  saveState();
}

function toggleShuffle(){
  shuffleMode = !shuffleMode;
  shuffleBtn.style.background = shuffleMode ? 'linear-gradient(45deg,#00d4ff,#ff006e)' : '';
  saveState();
}

function formatTime(s){
  if(isNaN(s)) return '0:00';
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return `${m}:${sec<10?'0':''}${sec}`;
}

audio.addEventListener('timeupdate',()=>{
  if(audio.duration){
    const percent = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = percent + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
});
audio.addEventListener('loadedmetadata',()=>{
  totalTimeEl.textContent = formatTime(audio.duration);
});
progressBar.addEventListener('click',(e)=>{
  const rect = progressBar.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pos * audio.duration;
});
volumeSlider.addEventListener('input',()=>{
  audio.volume = volumeSlider.value/100;
  updateVolumeIcon(volumeSlider.value);
});
function updateVolumeIcon(v){
  if(v==0) volumeIcon.textContent='🔇';
  else if(v<33) volumeIcon.textContent='🔈';
  else if(v<66) volumeIcon.textContent='🔉';
  else volumeIcon.textContent='🔊';
}

function saveState(){
  const state = {
    track: currentTrack,
    time: audio.currentTime,
    volume: audio.volume,
    repeat: repeatMode,
    shuffle: shuffleMode,
    playing: isPlaying
  };
  try{
    const str = btoa(JSON.stringify(state));
    history.replaceState(null,'',location.pathname + '#' + str);
  }catch(e){}
}
function loadState(){
  try{
    const hash = location.hash.slice(1);
    if(!hash) return;
    const state = JSON.parse(atob(hash));
    if(state.track != null && state.track < tracks.length){
      currentTrack = state.track;
      audio.src = tracks[currentTrack].src;
      audio.currentTime = state.time || 0;
      audio.volume = state.volume || 1;
      volumeSlider.value = audio.volume*100;
      updateVolumeIcon(volumeSlider.value);
      repeatMode = state.repeat || 0;
      shuffleMode = state.shuffle || false;
      audio.loop = repeatMode===1;
      toggleRepeat();
      toggleShuffle();
    }
  }catch(e){}
}

audio.addEventListener('ended',()=>{ if(repeatMode!==1) nextTrack(); });

window.addEventListener('load',()=>{
  loadState();
  updateVolumeIcon(volumeSlider.value);
});
</script>
</body>
</html>
