<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Advanced Playlist Generator v2.0</title>
<style>
  :root {
    --primary: #00d4ff;
    --secondary: #ff006e;
    --bg: #1a1a2e;
    --item-bg: rgba(255,255,255,0.05);
  }
  * { box-sizing: border-box; outline: none; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    width: 100%;
    max-width: 900px;
  }
  h1 { 
    text-align: center; 
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 30px;
  }

  /* === DROP ZONE === */
  .drop-zone {
    border: 3px dashed #444;
    border-radius: 15px;
    padding: 40px;
    text-align: center;
    background: rgba(0,0,0,0.2);
    transition: all 0.3s;
    cursor: pointer;
    margin-bottom: 20px;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--primary);
    background: rgba(0, 212, 255, 0.05);
  }
  .drop-zone p { font-size: 1.2em; color: #aaa; pointer-events: none; }
  #fileInput {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
  }

  /* === SETTINGS === */
  .settings {
    display: flex; gap: 10px; margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1; padding: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid #444; color: #fff;
    border-radius: 8px;
  }

  /* === TRACK LIST === */
  .track-list {
    list-style: none; padding: 0; margin: 0 0 20px 0;
  }
  .track-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--item-bg);
    margin-bottom: 8px; padding: 10px;
    border-radius: 8px; border: 1px solid transparent;
    transition: transform 0.2s, background 0.2s;
  }
  .track-item.dragging {
    opacity: 0.5; background: #333;
    border: 1px dashed var(--primary);
  }
  .drag-handle {
    cursor: grab; font-size: 1.2em; opacity: 0.5; padding: 0 5px;
  }
  .play-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.1); color: var(--primary);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 1.2em; flex-shrink: 0;
  }
  .play-btn:hover { background: rgba(255,255,255,0.2); }
  .play-btn.playing { background: var(--primary); color: #fff; }

  .track-inputs { flex: 1; display: flex; gap: 10px; flex-wrap: wrap; }
  .track-inputs input {
    background: transparent; border: none; border-bottom: 1px solid #444;
    color: #fff; padding: 5px; width: 100%;
  }
  .track-inputs input:focus { border-bottom-color: var(--primary); }
  .t-title { font-weight: bold; font-size: 1em; }
  .t-artist { font-size: 0.85em; color: #ccc; }
  
  .track-meta {
    display: flex; align-items: center; gap: 10px; font-family: monospace; color: #aaa;
  }
  .remove-btn {
    background: transparent; border: none; color: #ff4444;
    cursor: pointer; font-size: 1.2em; padding: 5px;
    opacity: 0.7;
  }
  .remove-btn:hover { opacity: 1; transform: scale(1.1); }

  /* === ACTION AREA === */
  .actions { text-align: center; margin-top: 20px; }
  .gen-btn {
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    border: none; color: white; padding: 15px 40px;
    border-radius: 50px; font-size: 18px; font-weight: bold;
    cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  .gen-btn:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
  
  #outputArea {
    width: 100%; height: 200px; margin-top: 20px;
    background: #111; color: #0f0; border: 1px solid #333;
    padding: 15px; border-radius: 10px; font-family: monospace;
  }
</style>
</head>
<body>

<div class="container">
  <h1>💿 Генератор Плейлиста 2.0</h1>
  
  <div class="settings">
    <input type="text" id="defaultArtist" placeholder="Исполнитель по умолчанию (например: Сборник)" value="Неизвестный исполнитель">
  </div>

  <div class="drop-zone" id="dropZone">
    <p>📂 Перетащите MP3 файлы сюда или кликните для выбора</p>
    <input type="file" id="fileInput" multiple accept="audio/*">
  </div>

  <ul class="track-list" id="trackList">
    <!-- Сюда будут добавляться треки -->
  </ul>

  <div class="actions">
    <button class="gen-btn" onclick="generateCode()">⚙️ Сгенерировать Код</button>
    <div style="margin-top: 10px; font-size: 0.9em; color: #888;" id="status"></div>
  </div>

  <textarea id="outputArea" readonly placeholder="Здесь появится код..."></textarea>
  <button onclick="copyToClipboard()" style="background:transparent; border:1px solid #555; color:#fff; padding:8px 15px; border-radius:20px; margin-top:10px; cursor:pointer;">📋 Копировать в буфер</button>
</div>

<script>
let tracksData = []; // Здесь храним данные о треках
let currentAudio = null; // Для проигрывания
let currentPlayingId = null; // ID играющего трека

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const trackListEl = document.getElementById('trackList');
const defaultArtistInput = document.getElementById('defaultArtist');

// === DRAG & DROP ФАЙЛОВ ===
dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

// === ОБРАБОТКА ФАЙЛОВ ===
async function handleFiles(files) {
  const status = document.getElementById('status');
  status.textContent = "Загрузка и анализ файлов...";
  
  const newTracks = [];
  for (let file of files) {
    if (!file.type.startsWith('audio/')) continue;
    
    const duration = await getDuration(file);
    const defArtist = defaultArtistInput.value;
    
    // Пытаемся угадать Артиста и Название из имени файла (Artist - Title.mp3)
    let name = file.name.replace(/\.[^/.]+$/, ""); // Убрать расширение
    let artist = defArtist;
    let title = name;
    
    if (name.includes(' - ')) {
      const parts = name.split(' - ');
      artist = parts[0];
      title = parts.slice(1).join(' - ');
    }

    newTracks.push({
      id: Date.now() + Math.random(), // Уникальный ID
      file: file, // Сам файл (для проигрывания)
      fileName: file.name, // Имя для кода
      title: title,
      artist: artist,
      durationSec: duration,
      durationStr: formatTime(duration)
    });
  }

  tracksData = [...tracksData, ...newTracks];
  renderList();
  status.textContent = `Добавлено файлов: ${newTracks.length}`;
  setTimeout(() => status.textContent = "", 3000);
}

// Получение длительности
function getDuration(file) {
  return new Promise((resolve) => {
    const audio = new Audio(URL.createObjectURL(file));
    audio.onloadedmetadata = () => {
      resolve(audio.duration);
    };
    audio.onerror = () => resolve(0);
  });
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec<10?'0':''}${sec}`;
}

// === ОТРИСОВКА СПИСКА ===
function renderList() {
  trackListEl.innerHTML = '';
  
  tracksData.forEach((track, index) => {
    const li = document.createElement('li');
    li.className = 'track-item';
    li.draggable = true;
    li.dataset.index = index;
    
    const isPlaying = currentPlayingId === track.id;
    
    li.innerHTML = `
      <div class="drag-handle">☰</div>
      <button class="play-btn ${isPlaying ? 'playing' : ''}" onclick="togglePreview(${index})">
        ${isPlaying ? '⏸' : '▶'}
      </button>
      <div class="track-inputs">
        <input type="text" class="t-title" value="${track.title}" onchange="updateTrack(${index}, 'title', this.value)">
        <input type="text" class="t-artist" value="${track.artist}" onchange="updateTrack(${index}, 'artist', this.value)">
      </div>
      <div class="track-meta">
        <span>${track.durationStr}</span>
        <button class="remove-btn" onclick="removeTrack(${index})">✖</button>
      </div>
    `;
    
    // События для сортировки
    addDragEvents(li, index);
    
    trackListEl.appendChild(li);
  });
}

// === ЛОГИКА СОРТИРОВКИ (DRAG AND DROP LIST) ===
let dragStartIndex;

function addDragEvents(item, index) {
  item.addEventListener('dragstart', () => {
    dragStartIndex = index;
    item.classList.add('dragging');
  });

  item.addEventListener('dragover', (e) => {
    e.preventDefault(); // Разрешить drop
  });

  item.addEventListener('drop', () => {
    const dragEndIndex = index;
    swapItems(dragStartIndex, dragEndIndex);
    item.classList.remove('dragging');
  });
  
  item.addEventListener('dragend', () => {
    item.classList.remove('dragging');
  });
}

function swapItems(fromIndex, toIndex) {
  const item = tracksData[fromIndex];
  tracksData.splice(fromIndex, 1);
  tracksData.splice(toIndex, 0, item);
  renderList();
}

// === УПРАВЛЕНИЕ ДАННЫМИ И ПЛЕЕРОМ ===
function updateTrack(index, field, value) {
  tracksData[index][field] = value;
}

function removeTrack(index) {
  if (currentPlayingId === tracksData[index].id) {
    stopAudio();
  }
  tracksData.splice(index, 1);
  renderList();
}

function togglePreview(index) {
  const track = tracksData[index];
  
  if (currentPlayingId === track.id) {
    // Пауза
    if (currentAudio.paused) {
      currentAudio.play();
      renderList(); // Обновить иконку
    } else {
      currentAudio.pause();
      renderList(); // Обновить иконку
    }
  } else {
    // Новый трек
    stopAudio();
    currentAudio = new Audio(URL.createObjectURL(track.file));
    currentAudio.play();
    currentPlayingId = track.id;
    
    currentAudio.onended = () => {
      currentPlayingId = null;
      renderList();
    };
    renderList();
  }
}

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  currentPlayingId = null;
}

// === ГЕНЕРАЦИЯ КОДА ===
function generateCode() {
  if (tracksData.length === 0) {
    alert("Список пуст! Добавьте файлы.");
    return;
  }

  let code = "const tracks = [\n";
  tracksData.forEach(t => {
    // Экранирование кавычек в названии
    const title = t.title.replace(/"/g, '\\"');
    const artist = t.artist.replace(/"/g, '\\"');
    
    code += `  {title: "${title}", artist: "${artist}", src: "${t.fileName}", duration: "${t.durationStr}"},\n`;
  });
  code += "];";

  document.getElementById('outputArea').value = code;
  document.getElementById('status').textContent = "✅ Код успешно сгенерирован!";
}

function copyToClipboard() {
  const area = document.getElementById('outputArea');
  area.select();
  document.execCommand("copy");
  alert("Код скопирован! Вставьте его в плеер.");
}
</script>

</body>
</html>
